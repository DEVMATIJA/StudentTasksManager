<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tasks</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>Task List</h1>

<button onclick="window.location.href='/tasks/add'">
    Add New Task
</button>

<table border="1">

    <tr>
        <th>Id</th>
        <th>Title</th>
        <th>Description</th>
        <th>Category</th>
        <th>Completed</th>
        <th>Actions</th>
    </tr>

    <tr th:each="task : ${tasks}">

        <td th:text="${task.id}"></td>

        <td th:text="${task.title}"></td>

        <td th:text="${task.category}"></td>

        <td th:text="${task.description}"></td>

        <td th:text="${task.completed}"></td>

        <td>
            <a th:href="@{/tasks/edit/{id}(id=${task.id})}">Edit</a>
            |
            <a th:href="@{/tasks/complete/{id}(id=${task.id})}">Complete</a>
            |
            <a th:href="@{/tasks/delete/{id}(id=${task.id})}">Delete</a>

    </tr>



</table>

</body>
</html>
