<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <title>Statistics</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<h1>Application Statistics</h1>

<table>

  <tr>
    <th>Statistic</th>
    <th>Value</th>
  </tr>

  <tr>
    <td>Total Tasks</td>
    <td th:text="${totalTasks}"></td>
  </tr>

  <tr>
    <td>Completed Tasks</td>
    <td th:text="${completedTasks}"></td>
  </tr>

  <tr>
    <td>Pending Tasks</td>
    <td th:text="${pendingTasks}"></td>
  </tr>

  <tr>
    <td>Total Courses</td>
    <td th:text="${totalCourses}"></td>
  </tr>

</table>

<br>

<a href="/">Back Home</a>

</body>
</html>
